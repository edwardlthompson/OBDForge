# Proposed fdroiddata metadata for dev.foss.obdforge
# Copy to metadata/dev.foss.obdforge.yml on a dedicated fork branch.
# Do not put Summary/Description here — root fastlane/ supplies them.
# There is no fdroiddata fork branch for this app yet.

Categories:
  - Connectivity
  - System
License: GPL-3.0-or-later
AuthorName: Edward Thompson
WebSite: https://github.com/edwardlthompson/OBDForge
SourceCode: https://github.com/edwardlthompson/OBDForge
IssueTracker: https://github.com/edwardlthompson/OBDForge/issues
Changelog: https://github.com/edwardlthompson/OBDForge/blob/HEAD/CHANGELOG.md

AutoName: OBDForge

RepoType: git
Repo: https://github.com/edwardlthompson/OBDForge.git

Builds:
  - versionName: '1.14.0' # x-release-please-version
    versionCode: 25
    commit: POST_MERGE_TAG
    subdir: examples/android
    sudo:
      - echo "deb https://deb.debian.org/debian trixie main" > /etc/apt/sources.list.d/trixie.list
      - apt-get update
      - apt-get install -y -t trixie openjdk-21-jdk-headless
      - update-java-alternatives --set java-1.21.0-openjdk-amd64
    gradle:
      - foss
    scandelete:
      - examples/android/app/src/full
      - scripts/fetch-llm-model.py

AntiFeatures:
  NonFreeNet:
    en-US: GitHub `full` flavor may check GitHub Releases. The F-Droid foss
      build skips that auto-check and does not download models.

AutoUpdateMode: None
UpdateCheckMode: Tags
UpdateCheckData: examples/android/app/build.gradle.kts|versionCode\s*=\s*(\d+)|.|versionName\s*=\s*"([^"]+)"
CurrentVersion: '1.14.0' # x-release-please-version
CurrentVersionCode: 25
